services:
  # Backend service - Express.js + Python Agent subprocess
  - type: web
    name: customer-service-backend
    runtime: node
    plan: free
    buildCommand: cd webIntegrationTests/reactNode/server && npm install
    startCommand: cd webIntegrationTests/reactNode/server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AGENT_PORT
        value: 5001
      - key: AGENT_SUBPROCESS_ENABLED
        value: true
      - key: PYTHON_PATH
        value: python3
      - key: FRONTEND_URL
        value: https://customer-service-frontend.onrender.com

  # Frontend service - React/Vite SPA served as web service
  - type: web
    name: customer-service-frontend
    runtime: node
    plan: free
    buildCommand: cd webIntegrationTests/reactNode/client && npm install && VITE_API_URL=https://customer-service-backend.onrender.com npm run build
    startCommand: cd webIntegrationTests/reactNode/client && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://customer-service-backend.onrender.com
