services:
  # Backend service - Express + Python Agent
  - type: web
    name: customer-service-backend
    runtime: node
    plan: free
    buildCommand: cd webIntegrationTests/reactNode/server && npm install
    startCommand: cd webIntegrationTests/reactNode/server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AGENT_PORT
        value: 5001
      - key: AGENT_SUBPROCESS_ENABLED
        value: true
      - key: PYTHON_PATH
        value: python3
      # Set these in Render dashboard with your actual values:
      # - key: FRONTEND_URL
      #   value: https://your-frontend.onrender.com
      # - key: GROQ_API_KEY
      #   value: your_groq_key

  # Frontend service - React/Vite (Static SPA)
  - type: static site
    name: customer-service-frontend
    buildCommand: cd webIntegrationTests/reactNode/client && npm install && npm run build
    staticPublishPath: webIntegrationTests/reactNode/client/dist
    routes:
      - path: /api/*
        destination: https://customer-service-backend.onrender.com/api/:splat
      - path: /*
        destination: /index.html
